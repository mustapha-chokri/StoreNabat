services:
  postgres:
    image: postgres:17-alpine
    container_name: nabat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nabat_atlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nabat_atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nabat_internal

  redis:
    image: redis:7-alpine
    container_name: nabat_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nabat_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: nabat_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_LOCAL_ROOT: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    expose:
      - "3000"
    networks:
      - nabat_internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: nabat_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_LOCAL_ROOT: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - nabat_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: nabat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - nabat_internal

  certbot:
    image: certbot/certbot:latest
    container_name: nabat_certbot
    profiles: ["ssl"]
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - nabat_internal

volumes:
  postgres_data:
  redis_data:
  app_storage:

networks:
  nabat_internal:
    driver: bridge

